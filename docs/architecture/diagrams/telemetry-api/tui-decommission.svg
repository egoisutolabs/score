<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">TUI decommission: move behavior, then delete presentation</text>
  <text x="600" y="72" text-anchor="middle" font-size="13.5" fill="#64748b">no capability disappears accidentally, and no lifecycle authority moves into HTTP</text>

  <rect x="54" y="116" width="320" height="480" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
  <text x="214" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">apps/tui today</text>

  <g font-size="13">
    <rect x="82" y="184" width="264" height="54" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="214" y="216" text-anchor="middle" fill="#7c2d12">config keys + supervisor status</text>
    <rect x="82" y="254" width="264" height="54" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="214" y="286" text-anchor="middle" fill="#7c2d12">status / resolved file reads</text>
    <rect x="82" y="324" width="264" height="54" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="214" y="356" text-anchor="middle" fill="#7c2d12">PID + heartbeat health policy</text>
    <rect x="82" y="394" width="264" height="54" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="214" y="426" text-anchor="middle" fill="#7c2d12">byte-offset dated-log tail</text>
    <rect x="82" y="464" width="264" height="54" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="214" y="496" text-anchor="middle" fill="#7c2d12">start · stop · restart mutations</text>
    <rect x="82" y="534" width="264" height="38" rx="8" fill="#ffedd5" stroke="#fb923c"/>
    <text x="214" y="559" text-anchor="middle" font-weight="650" fill="#9a3412">Ink render + keymaps</text>
  </g>

  <rect x="456" y="116" width="290" height="480" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="601" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">migration destinations</text>

  <g font-size="13">
    <rect x="484" y="184" width="234" height="124" rx="9" fill="#ffffff" stroke="#93c5fd"/>
    <text x="601" y="212" text-anchor="middle" font-weight="700" fill="#1e40af">one resumable SSE stream</text>
    <text x="601" y="238" text-anchor="middle" fill="#334155">fleet + project snapshot events</text>
    <text x="601" y="260" text-anchor="middle" fill="#334155">span + event + metric replay</text>
    <text x="601" y="282" text-anchor="middle" fill="#334155">log events + live follow</text>

    <rect x="484" y="330" width="234" height="96" rx="9" fill="#ffffff" stroke="#93c5fd"/>
    <text x="601" y="358" text-anchor="middle" font-weight="700" fill="#1e40af">core observation policy</text>
    <text x="601" y="383" text-anchor="middle" fill="#334155">health state + reason codes</text>
    <text x="601" y="405" text-anchor="middle" fill="#334155">same edge cases, better output</text>

    <rect x="484" y="448" width="234" height="96" rx="9" fill="#ffffff" stroke="#93c5fd"/>
    <text x="601" y="476" text-anchor="middle" font-weight="700" fill="#1e40af">authoritative CLI</text>
    <text x="601" y="501" text-anchor="middle" fill="#334155">score up · down · restart</text>
    <text x="601" y="523" text-anchor="middle" fill="#334155">restart failure + convergence tests</text>
  </g>

  <line x1="374" y1="250" x2="456" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="374" y1="351" x2="456" y2="378" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="374" y1="421" x2="456" y2="285" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="374" y1="491" x2="456" y2="496" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="830" y="116" width="316" height="480" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="988" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">deletion gate</text>

  <g font-size="13" fill="#334155">
    <circle cx="866" cy="211" r="10" fill="#dcfce7" stroke="#22c55e"/>
    <text x="866" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">1</text>
    <text x="890" y="207">SSE proves observation parity</text>
    <text x="890" y="228" font-size="11.5" fill="#64748b">using migrated TUI fixtures</text>

    <circle cx="866" cy="281" r="10" fill="#dcfce7" stroke="#22c55e"/>
    <text x="866" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">2</text>
    <text x="890" y="277">CLI proves control parity</text>
    <text x="890" y="298" font-size="11.5" fill="#64748b">including restart failure boundaries</text>

    <circle cx="866" cy="351" r="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="866" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">3</text>
    <text x="890" y="347">web view fully operational</text>
    <text x="890" y="368" font-size="11.5" fill="#92400e">successor epic · the real removal trigger</text>

    <circle cx="866" cy="421" r="10" fill="#dcfce7" stroke="#22c55e"/>
    <text x="866" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">4</text>
    <text x="890" y="417">remove tui command + package</text>
    <text x="890" y="438" font-size="11.5" fill="#64748b">remove Ink and React surface · CLI stays</text>

    <circle cx="866" cy="491" r="10" fill="#dcfce7" stroke="#22c55e"/>
    <text x="866" y="496" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">5</text>
    <text x="890" y="487">search for stale references</text>
    <text x="890" y="508" font-size="11.5" fill="#64748b">imports · commands · docs · deps</text>

    <circle cx="866" cy="561" r="10" fill="#dcfce7" stroke="#22c55e"/>
    <text x="866" y="566" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">6</text>
    <text x="890" y="557">check · test · build</text>
    <text x="890" y="578" font-size="11.5" fill="#64748b">then the TUI is gone completely</text>
  </g>

  <line x1="746" y1="356" x2="830" y2="356" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="630" width="540" height="44" rx="22" fill="#0f172a"/>
  <text x="600" y="658" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8fafc">Observe through SSE · mutate through CLI · render nowhere</text>

  <text x="600" y="690" text-anchor="middle" font-size="11.5" fill="#94a3b8">score · TUI decommission map · 2026-08-14</text>
</svg>
