name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Trusted publishing needs npm >= 11.5.1; Node 24 bundles it.
      - name: Set up Node (npm registry auth)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: |
          bun run check
          bun run test
          bun run build

      # The daemon build bundles every @score/* workspace dep into dist, so the
      # published package is dist + a bin shim and declares no dependencies.
      - name: Stage publishable package
        working-directory: apps/daemon
        run: |
          mkdir -p publish/bin
          cp -r dist publish/dist
          cp ../../LICENSE ../../README.md publish/
          printf '#!/usr/bin/env bun\nimport "../dist/index.js";\n' > publish/bin/score.js
          chmod +x publish/bin/score.js
          cat > publish/package.json <<EOF
          {
            "name": "@egoisuto/score",
            "version": "${GITHUB_REF_NAME#v}",
            "description": "One daemon runs the whole issue -> PR -> green -> merged pipeline",
            "type": "module",
            "license": "AGPL-3.0-only",
            "bin": { "score": "bin/score.js" },
            "engines": { "bun": ">=1.3.0" },
            "repository": { "type": "git", "url": "git+https://github.com/egoisutolabs/score.git" }
          }
          EOF

      # Auth is OIDC (trusted publisher configured on npmjs.com) — no token.
      # Stage-only: a maintainer approves the release with 2FA before it goes live.
      - name: Stage publish to npm
        working-directory: apps/daemon/publish
        run: npm stage publish --access public
